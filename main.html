<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty's Collection</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#fdfdfd; }
    header { background:#e6b8c3; padding:20px; text-align:center; }
    nav { background:#333; padding:10px; text-align:center; }
    nav a { color:#fff; margin:0 15px; text-decoration:none; }
    .products { display:flex; flex-wrap:wrap; justify-content:center; padding:20px; }
    .product { border:1px solid #ddd; border-radius:5px; margin:15px; width:250px; text-align:center; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .product img { width:100%; height:auto; border-bottom:1px solid #ddd; }
    .product h3 { margin:10px 0; }
    .cart { background:#f4f4f4; padding:20px; }
    .cart h2 { margin-top:0; }
    .cart-items { margin-bottom:15px; }
    .checkout-btn { background:#e6b8c3; border:none; padding:10px 20px; cursor:pointer; font-size:16px; }
    .upload-form { background:#fff3f7; padding:20px; margin:20px; border:1px solid #ddd; }
    .upload-form input { margin:5px; padding:8px; }
  </style>
</head>
<body>

  <header>
    <h1>Beauty's Collection</h1>
    <p>Sarees • Jewellery • Embroidery</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Sarees</a>
    <a href="#">Jewellery</a>
    <a href="#">Embroidery</a>
    <a href="#">Contact</a>
  </nav>

  <!-- Upload Form (visible only to owner if auth is added) -->
  <section class="upload-form">
    <h2>Add New Product</h2>
    <input type="text" id="product-name" placeholder="Product Name">
    <input type="text" id="product-price" placeholder="Price (₹)">
    <input type="text" id="product-image" placeholder="Image URL">
    <button onclick="addNewProduct()">Upload Product</button>
  </section>

  <!-- Product List -->
  <section class="products" id="products"></section>

  <!-- Cart -->
  <section class="cart">
    <h2>Your Cart</h2>
    <div class="cart-items" id="cart-items"></div>
    <button class="checkout-btn" onclick="checkout()">Checkout via WhatsApp</button>
  </section>

  <footer>
    <p>&copy; 2026 Beauty's Collection. All rights reserved.</p>
  </footer>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const supabaseUrl = "https://YOUR_PROJECT_URL.supabase.co";
    const supabaseKey = "YOUR_ANON_KEY"; // Replace with your Supabase anon key
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    let cart = [];

    function addToCart(name, price) {
      cart.push({name, price});
      displayCart();
    }

    function displayCart() {
      const cartItemsDiv = document.getElementById('cart-items');
      cartItemsDiv.innerHTML = '';
      cart.forEach((item, index) => {
        cartItemsDiv.innerHTML += `<p>${index+1}. ${item.name} - ₹${item.price}</p>`;
      });
    }

    function checkout() {
      if(cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      let message = "Hello, I'd like to order:\n";
      cart.forEach((item, index) => {
        message += `${index+1}. ${item.name} - ₹${item.price}\n`;
      });

      const numbers = ["8015517625", "8838752820"];
      const chosenNumber = numbers[Math.floor(Math.random() * numbers.length)];
      const url = `https://wa.me/${chosenNumber}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    async function addNewProduct() {
      const name = document.getElementById('product-name').value;
      const price = document.getElementById('product-price').value;
      const image = document.getElementById('product-image').value;

      if(!name || !price || !image) {
        alert("Please fill all fields!");
        return;
      }

      const { data, error } = await supabaseClient
        .from('products')
        .insert([{ name, price, image_url: image }]);

      if(error) {
        alert("Error uploading product: " + error.message);
      } else {
        alert("Product uploaded successfully!");
        loadProducts();
      }
    }

    async function loadProducts() {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*');

      if(error) {
        console.error(error);
        return;
      }

      const productsDiv = document.getElementById('products');
      productsDiv.innerHTML = '';
      data.forEach(product => {
        productsDiv.innerHTML += `
          <div class="product">
            <img src="${product.image_url}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p>₹${product.price}</p>
            <button onclick="addToCart('${product.name}', '${product.price}')">Add to Cart</button>
          </div>
        `;
      });
    }

    loadProducts(); // Load products on page load
  </script>

</body>
</html>
